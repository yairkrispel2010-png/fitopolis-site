<!doctype html>
<html>
<head>

<x-dc>

  <style>
    body { margin: 0; background: #FBFAF7; font-family: Rubik, "Segoe UI", system-ui, sans-serif; }
    a { color: #12939D; text-decoration: none; }
    a:hover { color: #0E767E; }
  </style>
</helmet>
<div dir="rtl" style="width: 1440px; min-height: 760px; background: #FBFAF7; color: #221E1A; display: flex; flex-direction: column;">

  <!-- סרגל עליון -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 26px 72px;">
    <span dir="ltr" style="display: inline-flex; align-items: center; font-family: Fredoka, Rubik, sans-serif; font-weight: 600; font-size: 28px; letter-spacing: 0.02em; line-height: 1;">
      <span style="color: #12939D;">FIT</span>
      <svg viewBox="0 0 100 100" style="width: 0.78em; height: 0.78em; margin: 0 0.03em;" aria-hidden="true"><path d="M 41.8 17 A 34 34 0 0 0 41.8 83" fill="none" stroke="#F07C1A" stroke-width="14" stroke-linecap="round"></path><path d="M 58.2 17 A 34 34 0 0 1 58.2 83" fill="none" stroke="#12939D" stroke-width="14" stroke-linecap="round"></path></svg>

    <a href="#" style="font-size: 16px; font-weight: 500; color: #5C564E;">לדף הבית</a>

  <!-- תוכן -->
  <div style="display: flex; flex-direction: column; gap: 28px; max-width: 660px; width: 100%; margin: 0 auto; padding: 40px 24px 80px 24px;">
    <div style="font-family: Fredoka, Rubik, sans-serif; font-weight: 600; font-size: 42px;">תמיכה</div>
    <div style="font-size: 18px; line-height: 1.65; color: #5C564E;">נתקלתם בבעיה? יש שאלה על פיטופוליס? תשלחו אלינו מייל ונחזור אליכם.</div>

    <div style="background: #FFFFFF; border: 1px solid #EFEAE2; border-radius: 24px; padding: 28px; display: flex; align-items: center; gap: 18px;">
      <span style="width: 50px; height: 50px; border-radius: 999px; background: #E7F2F3; display: inline-flex; align-items: center; justify-content: center; flex: none;">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#12939D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 17px; font-weight: 600;">מייל התמיכה</span>
        <span dir="ltr" style="font-size: 16px; color: #5C564E;">[ כתובת המייל תיקבע בשלב הבנייה ]</span>
      </div>
    </div>
    <div style="font-size: 14px; color: #8A8A8A;">אין כאן טופס בכוונה — פשוט כותבים מייל רגיל.</div>

    <div style="border: 1.5px dashed #D8D2C8; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center;">
      <span style="font-family: Fredoka, Rubik, sans-serif; font-weight: 600; font-size: 22px; color: #8A8A8A;">שאלות נפוצות</span>
      <span style="font-size: 15px; color: #8A8A8A;">[ ייכנסו כאן כשיהיו שאלות אמיתיות מהשטח — לא ממציאים שאלות ]</span>
    </div>

  <!-- פוטר -->
  <div style="margin-top: auto; border-top: 1px solid #EFEAE2; padding: 22px 72px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #8A8A8A;">
    <span>© 2026 פיטופוליס</span>
    <a href="#" style="color: #8A8A8A;">לדף הבית</a>
