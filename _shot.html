<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style></head>
<body><div style="position:fixed;top:0;left:0;right:0;z-index:9;background:#14212A;color:#fff;font:14px system-ui;padding:8px 14px;direction:rtl;text-align:center">זה כלי צילום פנימי (הדף בתוך מסגרת קבועה). האתר עצמו: <a href="/" style="color:#F07C1A;font-weight:700">localhost:8571</a></div><script>
const q=new URLSearchParams(location.search);
const w=+q.get('w')||1280, h=+q.get('h')||900, t=q.get('t')||'1.2', y=q.get('y')||'0', sel=q.get('sel'), url=q.get('u')||'/';
const f=document.createElement('iframe'); f.width=w; f.height=h; f.style.marginTop='36px'; f.src=url+(url.includes('?')?'&':'?')+'shot=1';
f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');
 s.textContent='.reveal,.dp-screen,.dp-screen *,.breathe,.drift-a,.drift-b,.drift-c,.fu-status *{animation-play-state:paused !important;animation-delay:-'+t+'s !important}.dp.flip-out,.dp.flip-in,.dp.is-turning,.dp.is-turning .dp-sheen,.dp.is-turning .dp-back::after,.dp-wrap.is-flipping .dp-ground{animation-play-state:running !important;animation-delay:0s !important}';
 d.head.appendChild(s); d.querySelectorAll('.scroll-reveal').forEach(e=>{e.style.transition='none';e.classList.add('is-visible')});
 d.documentElement.style.scrollBehavior='auto'; if(q.get('x')){const xs=d.createElement('style'); xs.textContent=q.get('x'); d.head.appendChild(xs);} const go=()=>{ if(sel){ const el=d.querySelector(sel); if(el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 24); }
   else if(y==='end') f.contentWindow.scrollTo(0, d.documentElement.scrollHeight);
   else f.contentWindow.scrollTo(0,+y); };
 go(); setTimeout(go, 600); setTimeout(go, 1500);
 if(q.get('a')){ setTimeout(()=>{ const ph=d.querySelector(q.get('ph')||'.hero .dp'); q.get('a').split('|').forEach((a,i)=>setTimeout(()=>{ const el=a.indexOf(':')!==-1||a.indexOf('-')===-1?ph.querySelector('[data-act="'+a+'"]'):ph.parentNode.querySelector('.'+a); if(el) el.click(); }, i*120)); }, +(q.get('at')||1800)); }
 if(q.get('js')){ setTimeout(()=>{ try{ new Function('d','w',q.get('js'))(d,f.contentWindow);}catch(e){} }, +(q.get('jsat')||q.get('at')||1800)); }
 document.title='ready';};
document.body.appendChild(f);
</script></body></html>
