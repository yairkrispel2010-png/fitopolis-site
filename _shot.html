<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style></head>
<body><script>
const q=new URLSearchParams(location.search);
const w=+q.get('w')||1280, h=+q.get('h')||900, t=q.get('t')||'1.2', y=q.get('y')||'0', sel=q.get('sel'), url=q.get('u')||'/';
const f=document.createElement('iframe'); f.width=w; f.height=h; f.src=url+(url.includes('?')?'&':'?')+'shot=1';
f.onload=()=>{const d=f.contentDocument;const s=d.createElement('style');
 s.textContent='.reveal,.dp-screen,.dp-screen *,.breathe,.drift-a,.drift-b,.drift-c,.fu-status *{animation-play-state:paused !important;animation-delay:-'+t+'s !important}';
 d.head.appendChild(s); d.querySelectorAll('.scroll-reveal').forEach(e=>{e.style.transition='none';e.classList.add('is-visible')});
 d.documentElement.style.scrollBehavior='auto'; if(q.get('x')){const xs=d.createElement('style'); xs.textContent=q.get('x'); d.head.appendChild(xs);} const go=()=>{ if(sel){ const el=d.querySelector(sel); if(el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 24); }
   else if(y==='end') f.contentWindow.scrollTo(0, d.documentElement.scrollHeight);
   else f.contentWindow.scrollTo(0,+y); };
 go(); setTimeout(go, 600); setTimeout(go, 1500); document.title='ready';};
document.body.appendChild(f);
</script></body></html>
